[project]
name = "adcp"
version = "0.1.0"
description = "Agent Deployment Control Plane: versioned agent artifacts, eval gate, canary, Pareto rollback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jahnavi Yelamanchi" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2.60",
  "mcp>=1.2",
  "redis>=5.2",
  "psycopg[binary]>=3.2",
  "aiokafka>=0.12",
  "openfeature-sdk>=0.7",
  "openfeature-provider-flagd>=0.2",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "mlflow>=2.18",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.40",
  "openai>=1.55",
  "google-genai>=0.3",
  "boto3>=1.35",
  "azure-ai-inference>=1.0.0b6",
  "azure-identity>=1.19",
]
evals = ["inspect-ai>=0.3.50"]
deep = ["deepagents>=0.0.5", "langchain-mcp-adapters>=0.1"]
serve = ["ray[serve]>=2.40"]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pre-commit>=4.0",
  "types-PyYAML",
]

[project.scripts]
adcp = "adcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["adcp"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
