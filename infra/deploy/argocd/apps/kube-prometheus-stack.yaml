apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: adcp
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.3.1
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            enableFeatures: [exemplar-storage]
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        grafana:
          sidecar:
            dashboards: {enabled: true, searchNamespace: ALL}
          additionalDataSources:
            - {name: Tempo, type: tempo, uid: tempo, url: "http://tempo.monitoring.svc:3200"}
            - {name: Loki, type: loki, uid: loki, url: "http://loki.monitoring.svc:3100"}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
