{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ar.saName" . }}
  labels:
    {{- include "ar.labels" . | nindent 4 }}
    {{- if eq .Values.serviceAccount.cloud "azure" }}
    azure.workload.identity/use: "true"
    {{- end }}
  annotations:
    {{- if eq .Values.serviceAccount.cloud "aws" }}
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.awsRoleArn required for cloud=aws" .Values.serviceAccount.awsRoleArn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- if eq .Values.serviceAccount.cloud "azure" }}
    azure.workload.identity/client-id: {{ required "serviceAccount.azureClientId required for cloud=azure" .Values.serviceAccount.azureClientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
