{{- if and .Values.istio.enabled (eq .Values.strategy "canary") }}
# Argo Rollouts rewrites weights on route "primary" at each setWeight step.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: agent-runtime
  labels:
    {{- include "ar.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.istio.host }}
    {{- range .Values.istio.externalHosts }}
    - {{ . }}
    {{- end }}
  {{- with .Values.istio.gateways }}
  gateways:
    - mesh
    {{- toYaml . | nindent 4 }}
  {{- end }}
  http:
    - name: primary
      route:
        - destination: {host: {{ .Values.istio.host }}, subset: stable, port: {number: 8080}}
          weight: 100
        - destination: {host: {{ .Values.istio.host }}, subset: canary, port: {number: 8080}}
          weight: 0
      retries: {attempts: 2, perTryTimeout: 30s, retryOn: "5xx,reset,connect-failure"}
      timeout: 60s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: agent-runtime
  labels:
    {{- include "ar.labels" . | nindent 4 }}
spec:
  host: {{ .Values.istio.host }}
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
  # Rollouts sets rollouts-pod-template-hash on each subset.
  subsets:
    - name: stable
      labels: {app: agent-runtime}
    - name: canary
      labels: {app: agent-runtime}
{{- end }}
