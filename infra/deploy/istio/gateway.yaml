# Ingress for agent-runtime. Set agent-runtime values istio.gateways=[istio-ingress/adcp-gateway].
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: adcp-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["*"]
