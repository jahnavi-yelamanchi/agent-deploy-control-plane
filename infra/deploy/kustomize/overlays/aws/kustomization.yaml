# EKS: IRSA role + ECR image. Values come from `terraform -chdir=infra/terraform/aws output`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {group: argoproj.io, kind: Application, name: agent-runtime}
    path: agent-runtime-values.yaml
  - target: {group: argoproj.io, kind: Application, name: rollback-controller}
    patch: |-
      - op: add
        path: /spec/source/helm
        value:
          valuesObject:
            image: {repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/adcp/agent-runtime}
