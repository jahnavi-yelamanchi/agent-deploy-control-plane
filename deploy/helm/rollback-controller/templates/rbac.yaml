apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollback-controller
  labels:
    {{- include "rc.labels" . | nindent 4 }}
---
# Abort / promote = patch on rollouts + rollouts/status (what `kubectl argo rollouts abort|promote` does).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollback-controller
  namespace: {{ .Values.rolloutNamespace }}
  labels:
    {{- include "rc.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [argoproj.io]
    resources: [analysisruns, analysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollback-controller
  namespace: {{ .Values.rolloutNamespace }}
  labels:
    {{- include "rc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollback-controller
subjects:
  - kind: ServiceAccount
    name: rollback-controller
    namespace: {{ .Release.Namespace }}
