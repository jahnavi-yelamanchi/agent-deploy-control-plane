# KServe huggingface runtime with vLLM backend; prefix caching + fp8 KV cache.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-1-8b
  namespace: serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/enable-prometheus-scraping: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    nodeSelector: {pool: gpu}
    tolerations:
      - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
    model:
      modelFormat: {name: huggingface}
      args:
        - --model_name=llama-3.1-8b-instruct
        - --model_id=meta-llama/Llama-3.1-8B-Instruct
        - --backend=vllm
        - --enable-prefix-caching
        - --kv-cache-dtype=fp8
        - --block-size=16
        - --gpu-memory-utilization=0.90
        - --max-num-seqs=128
        - --max-model-len=16384
      env:
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}
      resources:
        requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "8", memory: 24Gi, nvidia.com/gpu: "1"}
---
# vllm:prefix_cache_hits_total, vllm:prefix_cache_queries_total, vllm:gpu_cache_usage_perc
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm
  namespace: serving
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: llama-3-1-8b
  podMetricsEndpoints:
    - targetPort: 8080   # huggingface server (vLLM backend) http port
      path: /metrics
      interval: 15s
