# kind + compose data plane (scripts/up.sh attaches compose containers to the kind network).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {group: argoproj.io, kind: Application, name: agent-runtime}
    path: agent-runtime-values.yaml
  - target: {group: argoproj.io, kind: Application, name: rollback-controller}
    path: rollback-controller-values.yaml
