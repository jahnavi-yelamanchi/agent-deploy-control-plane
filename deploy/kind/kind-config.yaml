# kind create cluster --name adcp --config deploy/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: adcp
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18080, protocol: TCP}  # istio ingress http (NodePort)
      - {containerPort: 30443, hostPort: 18443, protocol: TCP}
      - {containerPort: 30090, hostPort: 29090, protocol: TCP}  # prometheus (compose owns 9090)
      - {containerPort: 30030, hostPort: 23000, protocol: TCP}  # grafana (compose owns 3000)
      - {containerPort: 30081, hostPort: 28080, protocol: TCP}  # argo cd
  - role: worker
    labels: {pool: cpu}
  - role: worker
    labels: {pool: cpu}
