apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: adcp
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.7
    helm:
      valuesObject:
        meshConfig:
          enableTracing: true
          defaultConfig:
            tracing: {}
          extensionProviders:
            - name: otel-tracing
              opentelemetry: {service: otel-collector.monitoring.svc.cluster.local, port: 4317}
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
