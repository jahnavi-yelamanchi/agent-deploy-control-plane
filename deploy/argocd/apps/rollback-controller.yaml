apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollback-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: adcp
  source:
    repoURL: https://github.com/jahnavi-yelamanchi/agent-deploy-control-plane.git
    targetRevision: main
    path: deploy/helm/rollback-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
