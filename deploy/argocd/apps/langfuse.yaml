apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: adcp
  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: 1.2.14
    helm:
      valuesObject:
        langfuse:
          nextauth: {secret: {secretKeyRef: {name: langfuse-secrets, key: nextauth-secret}}}
          salt: {secretKeyRef: {name: langfuse-secrets, key: salt}}
        postgresql: {deploy: true}
        clickhouse: {deploy: true}
        redis: {deploy: true}
        s3: {deploy: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
