# App of apps: syncs every Application under deploy/argocd/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adcp-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: adcp
  source:
    repoURL: https://github.com/jahnavi-yelamanchi/agent-deploy-control-plane.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
