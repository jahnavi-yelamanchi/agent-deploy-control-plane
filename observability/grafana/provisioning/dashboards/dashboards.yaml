# Mount observability/grafana/dashboards at /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: adcp
    orgId: 1
    folder: Agent Control Plane
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
