name: e2e
# Full flow on a GitHub runner (Docker available): stage lite = compose stack + live request;
# stage full = kind + Argo CD + Rollouts + Istio + observability, then the canary/rollback demo.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "lite (compose only) or full (kind + demo)"
        type: choice
        options: [lite, full]
        default: lite
      provider:
        description: "mock (free) or real (needs ANTHROPIC_API_KEY repo secret)"
        type: choice
        options: [mock, real]
        default: mock
permissions:
  contents: read
  issues: write
concurrency:
  group: e2e-${{ inputs.stage }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_ISSUES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.provider }}" == real && -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::provider=real needs the ANTHROPIC_API_KEY repository secret"; exit 1
          fi
          {
            echo "MODEL_PROVIDER=${{ inputs.provider }}"
            [[ "${{ inputs.provider }}" == real ]] && echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "GITHUB_TOKEN=$GH_ISSUES_TOKEN"
            echo "GITHUB_REPO=${{ github.repository }}"
          } > .env
      - name: Install kind and Argo Rollouts plugin
        if: inputs.stage == 'full'
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          curl -fsSLo kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          sudo install kind kubectl-argo-rollouts /usr/local/bin/
          kind version; kubectl version --client; helm version --short; kubectl argo rollouts version --short

      - name: Stage 1 - compose stack + live request
        if: inputs.stage == 'lite'
        run: make up-lite
      - name: Stage 1 - check traces and metrics landed
        if: inputs.stage == 'lite'
        run: |
          for i in $(seq 1 5); do
            curl -fsS -X POST localhost:8080/run -H 'content-type: application/json' \
              -d "{\"task_id\":\"airline-00$i\",\"input\":\"\"}" >/dev/null
          done
          sleep 20
          echo "Prometheus adcp_runs_total:"
          curl -fsS 'localhost:9090/api/v1/query?query=sum(adcp_runs_total)' | python3 -m json.tool
          echo "Langfuse traces:"
          curl -fsS -u pk-lf-local:sk-lf-local 'localhost:3001/api/public/traces?limit=5' | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('data', [])), 'traces')"
          echo "Rollback controller decision from live Prometheus:"
          curl -sS -X POST localhost:8090/decide; echo

      - name: Stage 2 - cluster + GitOps
        if: inputs.stage == 'full'
        run: make up
      - name: Stage 3 - canary and rollback demo
        if: inputs.stage == 'full'
        run: make demo

      - name: Diagnostics
        if: always()
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yaml ps -a || true
          for s in runtime evaluator rollback-controller mlflow otel-collector langfuse-web; do
            echo "::group::logs $s"; docker compose --env-file .env -f infra/compose/docker-compose.yaml logs --tail 80 "$s" 2>/dev/null || true; echo "::endgroup::"
          done
          if kind get clusters 2>/dev/null | grep -qx adcp; then
            echo "::group::pods"; kubectl get pods -A -o wide || true; echo "::endgroup::"
            echo "::group::argocd apps"; kubectl -n argocd get applications || true; echo "::endgroup::"
            echo "::group::rollout"; kubectl argo rollouts get rollout agent-runtime -n agents || true; echo "::endgroup::"
            echo "::group::events agents"; kubectl -n agents get events --sort-by=.lastTimestamp | tail -40 || true; echo "::endgroup::"
            echo "::group::runtime logs"; kubectl -n agents logs -l app.kubernetes.io/name=agent-runtime --tail 60 -c runtime || true; echo "::endgroup::"
          fi
          df -h /; free -g
